name: Build Windows release

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to receive the Windows download
        required: true
        default: v0.1.7

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: >
          python -m pip install --upgrade pip &&
          python -m pip install -r requirements-build.txt pytest==8.3.5

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm delphic_desktop.spec

      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "delphic-ai-smoke-test"
          $env:DELPHIC_DATA_DIR = $dataDir
          $env:DELPHIC_OPEN_BROWSER = "false"
          $env:PORT = "5002"
          $stdout = Join-Path $env:RUNNER_TEMP "delphic-ai-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "delphic-ai-stderr.log"
          $process = Start-Process `
            -FilePath ".\dist\Delphic AI.exe" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) {
                throw "The packaged app exited with code $($process.ExitCode)."
              }
              try {
                $homeResponse = Invoke-WebRequest -Uri "http://127.0.0.1:5002/" -UseBasicParsing
                $scienceResponse = Invoke-WebRequest -Uri "http://127.0.0.1:5002/science" -UseBasicParsing
                if ($homeResponse.StatusCode -eq 200 -and $scienceResponse.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # The server may still be starting.
              }
            }

            if (-not $ready) {
              throw "The packaged app did not serve the Math and Science pages."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $stdout) {
              Write-Host "--- Delphic AI stdout ---"
              Get-Content $stdout
            }
            if (Test-Path $stderr) {
              Write-Host "--- Delphic AI stderr ---"
              Get-Content $stderr
            }
          }

      - name: Package download
        id: package
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag || 'v0.1.7' }}"
          $archive = "Delphic-AI-$tag-Windows-x64.zip"
          Compress-Archive -Path ".\dist\Delphic AI.exe" -DestinationPath $archive
          $checksum = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$checksum  $archive" | Out-File -Encoding ascii "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$archive.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Delphic-AI-Windows-x64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  publish-windows-release:
    if: github.event_name == 'workflow_dispatch'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Delphic-AI-Windows-x64
          path: release

      - name: Upload files to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" release/* --clobber
