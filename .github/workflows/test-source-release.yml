name: Test Python source download

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-source-download:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_DOTENV_DISABLED: "1"
      FLASK_DEBUG: "false"
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      MISTRAL_API_KEY: ""
      TOGETHER_API_KEY: ""
      OPENROUTER_API_KEY: ""
      XAI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test startup, native launchers and archive safeguards
        run: python -m pytest -q tests/test_run_app.py tests/test_source_launchers.py tests/test_source_release.py tests/test_packaging_assets.py
      - name: Build curated candidate
        run: python packaging/build_source_release.py
      - name: Install and restart extracted candidate with synthetic data
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          archive, = Path("dist/candidates").glob("*-Python.zip")
          subprocess.run([sys.executable, "scripts/check_source_release.py", "--archive", str(archive),
                          "--report", "source-download-check.json"], check=True)
      - name: Upload verification report only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-check-${{ matrix.os }}-python-${{ matrix.python }}
          path: source-download-check.json
          if-no-files-found: error
